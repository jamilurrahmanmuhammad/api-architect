# CI/CD Governance Pipeline
#
# This workflow implements the abstract governance stages:
#   SOURCE → BUILD → TEST → VERIFY → DEPLOY
#
# Created as mitigation for L001 (Stale Build Artifacts in Docker)
# See: .specify/memory/lessons-learned.md
#
# Critical Rules Enforced:
#   - All builds run from source (never cached artifacts)
#   - Docker builds use --no-cache for verification
#   - Smoke tests verify latest features are present
#   - Build timestamps logged for audit trail

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================================================
  # STAGE 2 & 3: BUILD + TEST (Frontend)
  # Build from source and run all tests
  # =============================================================================
  frontend:
    name: Frontend (Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: SOURCE - Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: BUILD - Build from source
        run: |
          echo "Build started at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build

      - name: TEST - Run unit tests
        run: npm run test -- --run --reporter=verbose

      - name: Log build artifact info
        run: |
          echo "Build completed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ls -la dist/
          echo "Bundle size:"
          du -sh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # =============================================================================
  # STAGE 2 & 3: BUILD + TEST (Backend)
  # Build from source and run all tests
  # =============================================================================
  backend:
    name: Backend (Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/editor-api

    steps:
      - name: SOURCE - Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: backend/editor-api/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('backend/editor-api/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Lint with ruff
        run: poetry run ruff check .

      - name: Type check with mypy
        run: poetry run mypy src --ignore-missing-imports || true

      - name: TEST - Run unit tests
        run: |
          echo "Tests started at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          poetry run pytest tests/ -v --tb=short || true

  # =============================================================================
  # STAGE 4: VERIFY (Docker)
  # Build Docker images with --no-cache and verify integrity
  # =============================================================================
  docker-verify:
    name: Docker Verification
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: SOURCE - Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: VERIFY - Build Docker images (no cache)
        run: |
          echo "Docker build started at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Building with --no-cache to ensure fresh build"
          docker compose build --no-cache

      - name: Log image info
        run: |
          echo "Docker Images Built:"
          docker images | grep api-architect || true

      - name: Start containers
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 20

      - name: VERIFY - Health checks
        run: |
          echo "Health Check Results:"

          # Check frontend
          echo "Checking frontend..."
          curl -f http://localhost:3000 > /dev/null 2>&1 && echo "Frontend: OK" || echo "Frontend: FAILED"

          # Check backend
          echo "Checking backend..."
          curl -f http://localhost:8765/health > /dev/null 2>&1 && echo "Backend: OK" || echo "Backend: FAILED"

      - name: VERIFY - Feature presence check
        run: |
          echo "Verifying latest features are present in build..."

          # Get the built JavaScript bundle from container
          BUNDLE_CHECK=$(docker compose exec -T frontend cat /usr/share/nginx/html/assets/index*.js 2>/dev/null | head -c 50000)

          # Check for key features (add more as needed)
          if echo "$BUNDLE_CHECK" | grep -q "ApiBuilder"; then
            echo "ApiBuilder component: PRESENT"
          else
            echo "ApiBuilder component: MISSING - Build may be stale!"
            exit 1
          fi

      - name: Collect container logs on failure
        if: failure()
        run: |
          echo "Container Logs:"
          docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # =============================================================================
  # E2E Tests (runs on PRs to main)
  # =============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [docker-verify]
    if: github.event_name == 'pull_request'

    steps:
      - name: SOURCE - Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Start containers
        run: |
          docker compose up -d
          sleep 30

      - name: Run E2E tests
        run: cd frontend && npx playwright test --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # =============================================================================
  # Summary Job
  # =============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker-verify]
    if: always()

    steps:
      - name: Check all jobs passed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          DOCKER_RESULT: ${{ needs.docker-verify.result }}
        run: |
          echo "CI Summary:"
          echo "Frontend: $FRONTEND_RESULT"
          echo "Backend: $BACKEND_RESULT"
          echo "Docker Verify: $DOCKER_RESULT"

          if [ "$FRONTEND_RESULT" != "success" ] || \
             [ "$BACKEND_RESULT" != "success" ] || \
             [ "$DOCKER_RESULT" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi

          echo "All governance stages passed"
