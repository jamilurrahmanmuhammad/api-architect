openapi: 3.0.3
info:
  title: PetStore
  version: 1.0.0
  description: A simple pet store API.
servers:
- url: /api/v1
paths:
  /pets:
    get:
      description: List all pets.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      description: Create a new pet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      description: Get a pet by ID.
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    put:
      description: Update a pet.
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    patch:
      description: Modify a pet partially.
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      description: A pet in the store.
      properties:
        id:
          type: integer
          description: Unique identifier
          example: 1
        name:
          type: string
          description: Pet name
          example: John Doe
        status:
          type: string
          description: Pet status (available, pending, sold)
          example: active
        category:
          $ref: '#/components/schemas/Category'
          description: Pet category
      required:
      - id
      - name
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          description: Category name
          example: John Doe
      required:
      - id
      - name
