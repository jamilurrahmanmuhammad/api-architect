services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: api-architect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: api_architect
      POSTGRES_PASSWORD: api_architect_secret
      POSTGRES_DB: api_architect_editor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_architect -d api_architect_editor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: api-architect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Editor API (FastAPI Backend)
  editor-api:
    build:
      context: ./backend/editor-api
      dockerfile: Dockerfile
    container_name: api-architect-editor-api
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8765"
      API_RELOAD: "false"
      API_LOG_LEVEL: "info"
      DATABASE_URL: "postgresql+asyncpg://api_architect:api_architect_secret@postgres:5432/api_architect_editor"
      DATABASE_ECHO: "false"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "10"
      ENVIRONMENT: "development"
      DEBUG: "true"
      SECRET_KEY: "change-this-in-production"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173"
      REDIS_URL: "redis://redis:6379"
      CACHE_TTL: "3600"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Frontend (React/Vite with Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api-architect-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      editor-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: api-architect-network
