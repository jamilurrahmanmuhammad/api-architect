apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-architect-ingress
  namespace: api-architect
  labels:
    app.kubernetes.io/name: api-architect
    app.kubernetes.io/part-of: api-architect
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: api-architect.example.com
      http:
        paths:
          # API routes - proxy to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: editor-api
                port:
                  number: 8765
          # Health check for backend
          - path: /health
            pathType: Exact
            backend:
              service:
                name: editor-api
                port:
                  number: 8765
          # All other routes - serve frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  tls:
    - hosts:
        - api-architect.example.com
      secretName: api-architect-tls
