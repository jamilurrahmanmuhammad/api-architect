apiVersion: v1
kind: Secret
metadata:
  name: api-architect-secrets
  namespace: api-architect
  labels:
    app.kubernetes.io/name: api-architect
    app.kubernetes.io/part-of: api-architect
type: Opaque
stringData:
  # Database Configuration
  # NOTE: Replace these values in production - never commit real secrets
  DATABASE_URL: "postgresql://api_architect:CHANGE_ME@postgres:5432/api_architect_editor"

  # Application Secrets
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"

  # Redis Configuration
  REDIS_URL: "redis://redis:6379"
