apiVersion: apps/v1
kind: Deployment
metadata:
  name: editor-api
  namespace: api-architect
  labels:
    app.kubernetes.io/name: editor-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: api-architect
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: editor-api
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: editor-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: api-architect
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: editor-api
          image: api-architect/editor-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-architect-config
            - secretRef:
                name: api-architect-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
