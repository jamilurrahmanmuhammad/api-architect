apiVersion: v1
kind: ConfigMap
metadata:
  name: api-architect-config
  namespace: api-architect
  labels:
    app.kubernetes.io/name: api-architect
    app.kubernetes.io/part-of: api-architect
data:
  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8765"
  API_RELOAD: "false"
  API_LOG_LEVEL: "info"

  # Database Configuration
  DATABASE_ECHO: "false"
  DATABASE_POOL_SIZE: "5"
  DATABASE_MAX_OVERFLOW: "10"

  # Application Configuration
  ENVIRONMENT: "production"
  DEBUG: "false"

  # CORS Configuration
  CORS_ORIGINS: "https://api-architect.example.com"

  # Cache Configuration
  CACHE_TTL: "3600"

  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # OpenTelemetry/Observability
  OTEL_ENABLED: "true"
