[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsl-parser"
version = "0.1.0"
description = "DSL Parser for Requirements Grammar Authoring Studio"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "API Architect Team"}
]
keywords = ["dsl", "parser", "requirements", "api", "lexer"]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
